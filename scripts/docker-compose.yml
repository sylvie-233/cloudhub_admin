# 本地环境编排（MySQL 8.0+ / InnoDB / utf8mb4 + API + Web）
# 启动全部：docker compose -f scripts/docker-compose.yml up -d --build
# 仅数据库：docker compose -f scripts/docker-compose.yml up -d mysql
# 停止：docker compose -f scripts/docker-compose.yml down
# 重置：docker compose -f scripts/docker-compose.yml down -v
name: cloudhub-admin

services:
  mysql:
    image: mysql:8.0
    container_name: cloudhub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cloudhub_admin}
      MYSQL_USER: ${MYSQL_USER:-cloudhub}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      # 仅数据目录为空时执行；脚本会 DROP 并重建 cloudhub_admin
      - ../doc/cloudhub_admin_v1.sql:/docker-entrypoint-initdb.d/01-cloudhub_admin.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    build:
      context: ../admin-monorepo
      dockerfile: apps/api/Dockerfile
    image: cloudhub-api:local
    container_name: cloudhub-api
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-cloudhub}
      DB_PASSWORD: ${MYSQL_PASSWORD:-123456}
      DB_NAME: ${MYSQL_DATABASE:-cloudhub_admin}
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-10}
      JWT_SECRET: ${JWT_SECRET:-cloudhub-admin-dev-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7200}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:8080}
      TZ: Asia/Shanghai
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    stop_grace_period: 15s

  web:
    build:
      context: ../admin-monorepo
      dockerfile: apps/web/Dockerfile
    image: cloudhub-web:local
    container_name: cloudhub-web
    restart: unless-stopped
    init: true
    environment:
      TZ: Asia/Shanghai
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    stop_grace_period: 10s


volumes:
  mysql_data:
    name: cloudhub_mysql_data
